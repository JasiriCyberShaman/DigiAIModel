<div id="dorimon-container" style="width: 100%; height: 500px; background: transparent; cursor: grab; display: flex; align-items: center; justify-content: center; overflow: hidden;">
    <div id="boot-status" style="color: #bc13fe; font-family: 'Courier New', monospace; font-size: 14px; text-shadow: 0 0 5px #bc13fe;">
        // INITIALIZING_CYBER_SHAMAN_OS...
    </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
    // --- 1. CONFIGURATION ---
    // Update these once your GitHub Pages and ngrok are live
    const GITHUB_ASSETS_URL = 'https://bryantgill.github.io/shaman-assets'; 
    const NGROK_BRIDGE_URL = 'wss://your-unique-id.ngrok-free.app'; 

    async function bootKuti() {
        const container = document.getElementById('dorimon-container');
        
        try {
            // 2. IMPORT ENGINE FROM GITHUB CDN
            // This pulls your Three.js logic from high-speed storage
            const engineUrl = `${GITHUB_ASSETS_URL}/KutiEngine.js?v=${Date.now()}`;
            const module = await import(engineUrl);
            
            // 3. INITIALIZE THREE.JS SCENE
            // We pass the container and the asset base path to the engine
            container.innerHTML = ""; 
            const engine = await module.initKuti('dorimon-container', {
                modelPath: `${GITHUB_ASSETS_URL}/models/shaman.glb`,
                texturePath: `${GITHUB_ASSETS_URL}/textures/`
            });

            // 4. ESTABLISH NEURAL LINK (Websocket)
            // This connects the visual model to your local Python AI
            connectToBrain(NGROK_BRIDGE_URL, engine);

            console.log(`✅ [Cyber Shaman]: Integrated Systems Online.`);

        } catch (err) {
            console.error("❌ [System Failure]:", err);
            container.innerHTML = `
                <div style="color: #ff4444; font-family: monospace; text-align: center;">
                    [CRITICAL_BOOT_ERROR]<br>
                    <span style="font-size: 10px; color: #888;">${err.message}</span>
                </div>`;
        }
    }

    function connectToBrain(url, engine) {
        const socket = new WebSocket(url);
        
        socket.onmessage = (event) => {
            const data = JSON.parse(event.data);
            if (data.type === "SPEECH_READY") {
                // Play audio and trigger lip-sync/animation in your Three.js engine
                engine.speak(data.url, data.text);
            }
        };

        socket.onopen = () => console.log("🧠 [Neural Link]: Connected to Local AI");
    }

    bootKuti();
</script>
